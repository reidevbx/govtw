<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>登入 — gov.tw Design System</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="/gov-tw.iife.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--govtw-font-sans, system-ui, -apple-system, sans-serif);
      color: var(--govtw-color-text-primary);
      background-color: var(--govtw-color-bg-canvas);
      margin: 0;
      padding: 40px;
      line-height: 1.6;
    }
    .demo-layout {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="demo-layout">
    <govtw-stack space="6">
      <govtw-error-summary no-autofocus>
        <ul><li><a href="#username">帳號或密碼錯誤，請重新輸入</a></li></ul>
      </govtw-error-summary>
      <h1>登入</h1>
      <govtw-text-input id="username" name="username" label="帳號" autocomplete="username" value="wang123"></govtw-text-input>
      <govtw-password-input name="password" label="密碼"></govtw-password-input>
    </govtw-stack>
  </div>
</body>
</html>
