<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>搜尋結果頁 — gov.tw Design System</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="/gov-tw.iife.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--govtw-font-sans, system-ui, -apple-system, sans-serif);
      color: var(--govtw-color-text-primary);
      background-color: var(--govtw-color-bg-canvas);
      margin: 0;
      padding: 40px;
      line-height: 1.6;
    }
    .demo-layout {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="demo-layout">
    <govtw-stack space="6">
      <h1>搜尋結果</h1>
      <govtw-search label="搜尋本網站" value="補肋"></govtw-search>
      <p>找不到符合「補肋」的結果。</p>
      <div>
        <p>你可以：</p>
        <ul>
          <li>檢查有沒有錯字</li>
          <li>改用其他關鍵字，或用較少的字詞</li>
          <li>用較通用的說法，例如「補助」而不是「補助款申請表」</li>
        </ul>
      </div>
    </govtw-stack>
  </div>
</body>
</html>
