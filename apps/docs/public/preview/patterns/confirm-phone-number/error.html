<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>確認手機號碼 — gov.tw Design System</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="/gov-tw.iife.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--govtw-font-sans, system-ui, -apple-system, sans-serif);
      color: var(--govtw-color-text-primary);
      background-color: var(--govtw-color-bg-canvas);
      margin: 0;
      padding: 40px;
      line-height: 1.6;
    }
    .demo-layout {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="demo-layout">
    <govtw-stack space="6">
      <govtw-error-summary no-autofocus>
        <ul><li><a href="#otp">驗證碼錯誤，請重新輸入</a></li></ul>
      </govtw-error-summary>
      <h1>輸入簡訊驗證碼</h1>
      <govtw-otp-input id="otp" name="otp" value="12345" error="驗證碼錯誤，請重新輸入" resend-delay="0"></govtw-otp-input>
    </govtw-stack>
  </div>
</body>
</html>
