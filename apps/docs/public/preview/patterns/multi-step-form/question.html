<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>多步驟表單 — gov.tw Design System</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="/gov-tw.iife.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--govtw-font-sans, system-ui, -apple-system, sans-serif);
      color: var(--govtw-color-text-primary);
      background-color: var(--govtw-color-bg-canvas);
      margin: 0;
      padding: 40px;
      line-height: 1.6;
    }
    .demo-layout {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="demo-layout">
    <form novalidate onsubmit="event.preventDefault()">
      <govtw-stack space="6">
        <govtw-back-link href="#"></govtw-back-link>
        <govtw-fieldset>
          <h1 slot="legend">你要申請哪一種戶籍謄本？</h1>
          <govtw-radio name="type" value="current" label="現戶全部"></govtw-radio>
          <govtw-radio name="type" value="partial" label="現戶部分"></govtw-radio>
          <govtw-radio name="type" value="history" label="除戶全部"></govtw-radio>
        </govtw-fieldset>
        <div><govtw-button type="submit">繼續</govtw-button></div>
      </govtw-stack>
    </form>
  </div>
</body>
</html>
