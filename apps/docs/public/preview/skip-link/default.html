<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>跳至主要內容 Skip Link — gov.tw Design System</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="/gov-tw.iife.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--govtw-font-sans, system-ui, -apple-system, sans-serif);
      color: var(--govtw-color-text-primary);
      background-color: var(--govtw-color-bg-canvas);
      margin: 0;
      padding: 40px;
      line-height: 1.6;
    }
    .demo-layout {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="demo-layout">
    <govtw-skip-link href="#demo-main-content"></govtw-skip-link>
    <div style="padding: 12px; background: var(--govtw-color-bg-surface); border-radius: var(--govtw-radius-sm);">頁首與導覽（略過這一區）</div>
    <div id="demo-main-content" style="padding: 12px; border: 1px dashed var(--govtw-color-border-default); border-radius: var(--govtw-radius-sm);">主內容：按下跳至主要內容後，焦點會移到這裡</div>
  </div>
</body>
</html>
