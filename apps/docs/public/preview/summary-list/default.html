<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>摘要清單 Summary List — gov.tw Design System</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="/gov-tw.iife.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--govtw-font-sans, system-ui, -apple-system, sans-serif);
      color: var(--govtw-color-text-primary);
      background-color: var(--govtw-color-bg-canvas);
      margin: 0;
      padding: 40px;
      line-height: 1.6;
    }
    .demo-layout {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="demo-layout">
    <govtw-summary-list>
      <dl>
        <div>
          <dt>姓名</dt>
          <dd>王小明</dd>
          <dd><govtw-link href="#">變更<span class="govtw-visually-hidden">姓名</span></govtw-link></dd>
        </div>
        <div>
          <dt>出生日期</dt>
          <dd>民國 78 年 7 月 2 日</dd>
          <dd><govtw-link href="#">變更<span class="govtw-visually-hidden">出生日期</span></govtw-link></dd>
        </div>
        <div>
          <dt>戶籍地址</dt>
          <dd>100057<br>臺北市中正區<br>範例路 1 號 3 樓</dd>
          <dd><govtw-link href="#">變更<span class="govtw-visually-hidden">戶籍地址</span></govtw-link></dd>
        </div>
      </dl>
    </govtw-summary-list>
  </div>
</body>
</html>
