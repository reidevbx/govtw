<!DOCTYPE html>
<html lang="zh-TW" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>頁內目錄 Contents List — gov.tw Design System</title>
  <link rel="stylesheet" href="/tokens.css">
  <script src="/gov-tw.iife.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: var(--govtw-font-sans, system-ui, -apple-system, sans-serif);
      color: var(--govtw-color-text-primary);
      background-color: var(--govtw-color-bg-canvas);
      margin: 0;
      padding: 40px;
      line-height: 1.6;
    }
    .demo-layout {
      display: flex;
      flex-direction: column;
      flex-wrap: wrap;
      align-items: stretch;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="demo-layout">
    <govtw-contents-list>
      <ol>
        <li><a href="#background">一、計畫緣起</a></li>
        <li>
          <a href="#goals">二、計畫目標</a>
          <ol>
            <li><a href="#goals-short">（一）短期目標</a></li>
            <li><a href="#goals-long">（二）長期目標</a></li>
          </ol>
        </li>
        <li><a href="#budget">三、經費需求</a></li>
      </ol>
    </govtw-contents-list>
  </div>
</body>
</html>
